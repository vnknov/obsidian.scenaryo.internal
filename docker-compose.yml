services:
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian

    security_opt:
      - seccomp:unconfined

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - CUSTOM_USER=obsidian
      - PASSWORD=${OBSIDIAN_PASSWORD}
      - PIXELFLUX_WAYLAND=false
    volumes:
      - ${OBSIDIAN_VAULT_PATH}:/config
    
    # Available only to other containers on the Docker network.
    # These ports are NOT published directly to the LAN.
    expose:
      - "3000"     # Obsidian GUI, internal HTTP
      - "27123"    # REST API / MCP, internal HTTP
      - "27124"    # REST API / MCP, internal HTTPS
    
    shm_size: "5gb"
    networks:
      - proxy

    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    restart: unless-stopped
networks:
  proxy:
    external: true
